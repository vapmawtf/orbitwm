[colors]
background = #1e1e2e
foreground = #cdd6f4
active-ws  = #89b4fa
occupied-ws = #a6adc8
empty-ws   = #45475a
urgent     = #f38ba8
border     = #313244

[bar/main]
width = 100%
height = 28
radius = 0

background = ${colors.background}
foreground = ${colors.foreground}

border-bottom-size = 2
border-bottom-color = ${colors.border}

font-0 = JetBrainsMono Nerd Font:size=10;2
font-1 = JetBrainsMono Nerd Font:size=14;3

padding-left  = 1
padding-right = 1
module-margin = 1

modules-left   = xworkspaces
modules-center = date
modules-right  = cpu memory

tray-position = right
tray-padding  = 4

[module/xworkspaces]
type = internal/xworkspaces

pin-workspaces = false
show-urgent    = true
format         = <label-state>

label-active          = %index%
label-active-foreground = ${colors.active-ws}
label-active-padding  = 2

label-occupied          = %index%
label-occupied-foreground = ${colors.occupied-ws}
label-occupied-padding  = 2

label-urgent          = %index%
label-urgent-foreground = ${colors.urgent}
label-urgent-padding  = 2

label-empty           = %index%
label-empty-foreground = ${colors.empty-ws}
label-empty-padding   = 2

[module/date]
type     = internal/date
interval = 1
date     = %H:%M
date-alt = %d.%m.%Y %H:%M

label = 󰥔 %date%

[module/cpu]
type             = internal/cpu
interval         = 2
format-prefix    = "󰻠 "
label            = %percentage%%

[module/memory]
type          = internal/memory
interval      = 2
format-prefix = "󰍛 "
label         = %percentage_used%%